[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracenox"
version = "0.3.0"
description = "Evidence-Driven Cybersecurity Investigation Toolkit"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "flask>=3.0",
]

[project.scripts]
tracenox-web = "tracenox.webscan:main"
tracenox = "tracenox.cli.main:main"
tracenox-report-ui = "tracenox.webapp:main"

[tool.setuptools.packages.find]
include = ["tracenox*"]
