[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracenox"
version = "0.2.0"
description = "Evidence-Driven Cybersecurity Investigation Toolkit"
requires-python = ">=3.10"

[project.scripts]
tracenox = "tracenox.cli.main:main"


[tool.setuptools.packages.find]
include = ["tracenox*"]
